# ============================================================================
#  Qué monitorear. Edita este archivo; no hace falta tocar el código.
# ============================================================================
#  [[source]]   listado/categoría de una tienda
#     site       extractor a usar (ver scrapers/__init__.py)
#     max_pages  páginas a recorrer en el escaneo profundo (el rápido lee solo la 1)
#     enabled    false para desactivarla sin borrarla
#
#  Tiendas descartadas (verificado nov-2026):
#     Ripley        -> responde 403 "Blocked" a clientes automatizados
#     MercadoLibre  -> exige verificación de cuenta; su API pública responde 403
#     La Polar      -> ahora redirige a abc.cl (misma empresa), cubierta por "abc"
#     Movistar      -> robots.txt prohíbe todo a bots que no sean buscadores (queda enabled=false)
#     MacCenter     -> el dominio ya no existe (DNS)
#     Reifstore     -> el dominio está a la venta
#     SP Digital, Tottus -> Cloudflare "Attention Required / Just a moment"
#     Claro         -> Incapsula · Easy -> 403 · Corona -> no responde a IPs de la nube
#     WOM           -> precios ligados a planes/portabilidad y catálogo estático diario: alertas engañosas
#     Wei           -> casi no vende celulares
# ============================================================================

[[source]]
name = "Falabella · Smartphones"
site = "falabella"
url = "https://www.falabella.com/falabella-cl/category/cat720161/Smartphones"
max_pages = 3            # 48 por página

