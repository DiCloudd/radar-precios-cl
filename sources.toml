# ============================================================================
#  [[watch]]  productos individuales (página de producto). Se revisan en cada
#  ciclo rápido y avisan si se agotan / desaparecen / vuelven.
#  (También puedes agregarlos desde Telegram con /seguir <link>)
# ============================================================================
# [[watch]]
# name = "Mi Galaxy soñado"
# url  = "https://www.paris.cl/samsung-galaxy-a57-5g-128gb-navy-MKS5469055.html"
# target_price = 350000


# ============================================================================
#  [[target]]  precio objetivo por palabras clave (todas deben aparecer en el
#  nombre) o por product_key exacto. site es opcional.
#  (También desde Telegram: /objetivo 350000 galaxy a57)
# ============================================================================
[[target]]
label = "iPhone 17 bajo $800.000"
keywords = ["iphone 17"]
target_price = 800000

[[target]]
label = "Galaxy A57 bajo $350.000"
keywords = ["galaxy", "a57"]
target_price = 350000
