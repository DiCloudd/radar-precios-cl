# ============================================================================
#  Qué monitorear. Edita este archivo; no hace falta tocar el código.
# ============================================================================
#  [[source]]   listado/categoría de una tienda
#     site       extractor a usar (ver scrapers/__init__.py)
#     category   celulares | notebooks | televisores | consolas
#     max_pages  páginas a recorrer en el escaneo profundo
#     fast       true = también en el ciclo rápido (~2 min, solo página 1); false = solo escaneo profundo (~13 min)
#     enabled    false para desactivarla sin borrarla
#
#  ⚡ = "trampa de errores": el listado ordenado de MENOR a MAYOR precio. Un error de precio
#       (PS5 a $49.990) salta a la página 1, así que se detecta en ~2 min aunque la tienda tenga
#       miles de productos. Los listados normales (orden de la tienda) alimentan el historial.
#
#  Presupuesto anti-bloqueo: ciclo rápido ≈ 25 peticiones / 2 min repartidas en ~12 dominios
#  (máx. ~4 por dominio, separadas ≥4 s). Si agregas fuentes "fast", hazlo con moderación.
#
#  Tiendas descartadas (verificado nov-2026, desde IPs de la nube):
#     Ripley        -> 403 "Blocked" / captcha
#     MercadoLibre  -> exige verificación de cuenta; su API pública responde 403
#     La Polar      -> redirige a abc.cl (misma empresa), cubierta por "abc"
#     Movistar      -> robots.txt prohíbe todo a bots que no sean buscadores
#     SP Digital, Tottus, Weplay -> Cloudflare "Just a moment"
#     Claro -> Incapsula · Easy -> 403 · HP -> captcha · Corona, Microplay -> no responden a la nube
#     LG            -> precios solo con JavaScript (sin datos estructurados)
#     WOM           -> precios ligados a planes/portabilidad y catálogo estático diario: alertas engañosas
#     MacCenter, Reifstore -> ya no existen · Wei -> casi no vende celulares
# ============================================================================


