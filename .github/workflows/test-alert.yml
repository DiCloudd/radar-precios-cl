# Envía una alerta 🦖 Godzilla de PRUEBA a tu Telegram (sobre un producto real, precio simulado).
name: test-alert
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Leer la BD publicada (ahí está tu chat registrado con /start)
        run: |
          mkdir -p data
          git fetch -q --depth 1 origin gh-pages && git show origin/gh-pages:data/prices.db.gz | gunzip > data/prices.db
      - run: python main.py --godzilla-test
