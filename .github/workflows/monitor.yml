# Runner en la nube de respaldo (gratis en repos públicos): un ciclo profundo cada ~15 min + publica el dashboard.
# Cuando la VM de Oracle esté funcionando, desactívalo: Settings > Variables > MONITOR_ON_ACTIONS = false
name: monitor
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    if: vars.MONITOR_ON_ACTIONS != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Santiago
      TZ_NAME: America/Santiago
      MONITOR_RUNNER: github-actions
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BROWSER_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Ciclo profundo + dashboard
        run: python main.py --deep --publish
      - name: Resumen diario (si corresponde)
        run: python -c "from monitor import Monitor; Monitor().daily_summary()"
        if: always()
      - name: Re-publicar (incluye el estado del resumen)
        run: python main.py --publish
        if: always()
