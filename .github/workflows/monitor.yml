# Monitor en la nube, gratis (repo público). Cada ejecución es una "ventana" de ~12 min:
# 1 ciclo profundo + ciclos rápidos cada ~2 min, publicando el dashboard cada 5 min.
# Cada ventana que termina bien lanza la siguiente (encadenado). El cron de 15 min es el respaldo que
# reinicia la cadena si algo falla. Interruptor general: variable de repo MONITOR_ON_ACTIONS = false.
name: monitor
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Duración de la ventana (min)"
        default: "12"

permissions:
  contents: write     # publicar el dashboard en gh-pages
  actions: write      # encadenar la siguiente ventana

concurrency:
  group: monitor
  cancel-in-progress: false       # la siguiente ventana espera a que termine la actual (nunca dos a la vez)

jobs:
  run:
    if: vars.MONITOR_ON_ACTIONS != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Santiago
      TZ_NAME: America/Santiago
      MONITOR_RUNNER: github-actions
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BROWSER_FALLBACK: "false"
      PUBLISH_INTERVAL: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      # La BD viaja entre ventanas dentro de la rama gh-pages. Se lee directo de git (instantáneo),
      # no de la web publicada (que tarda ~1 min en actualizarse y podría estar desfasada).
      - name: Restaurar base de datos
        run: |
          mkdir -p data
          if git fetch -q --depth 1 origin gh-pages; then
            git show origin/gh-pages:data/prices.db.gz | gunzip > data/prices.db && ls -lh data/prices.db
          else
            echo "Sin respaldo previo: se parte de cero"
          fi

      - name: Ventana de monitoreo
        run: python main.py --loop --duration "${{ inputs.minutes || '12' }}"

      - name: Encadenar la siguiente ventana
        if: success()
        run: gh workflow run monitor.yml --ref "${{ github.ref_name }}"
