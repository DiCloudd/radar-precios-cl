# ✅ Autodiagnóstico: por cada tienda lee un producto real y lo verifica (relectura de listado + ficha).
# Corre solo cada día y también manualmente (Actions -> selftest -> Run workflow).
name: selftest
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"      # 08:17 Chile

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROWSER_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python main.py --selftest
      - name: Auditoría de falsos positivos y sensibilidad (catálogo real publicado)
        run: |
          git fetch -q --depth 1 origin gh-pages
          git show origin/gh-pages:data/prices.db.gz | gunzip > /tmp/audit.db
          python tools/audit_alerts.py /tmp/audit.db | tee /tmp/audit.txt
          grep -q "FALSOS POSITIVOS (alertarían HOY como producto nuevo): 0 " /tmp/audit.txt || (echo "::warning::Hay falsos positivos nuevos: revisa la auditoría"; exit 1)
