# ✅ Autodiagnóstico: por cada tienda lee un producto real y lo verifica (relectura de listado + ficha).
# Corre solo cada día y también manualmente (Actions -> selftest -> Run workflow).
name: selftest
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"      # 08:17 Chile

permissions:
  contents: read
  pages: read        # consultar cuántos builds de Pages hubo en la última hora

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROWSER_FALLBACK: "false"
      DB_KEY: ${{ secrets.DB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python main.py --selftest
      - name: Auditoría de falsos positivos y sensibilidad (catálogo real publicado)
        run: |
          git fetch -q --depth 1 origin gh-pages
          python backup.py restore /tmp/audit.db
          python tools/audit_alerts.py /tmp/audit.db | tee /tmp/audit.txt
          grep -q "FALSOS POSITIVOS (alertarían HOY como producto nuevo): 0 " /tmp/audit.txt || (echo "::warning::Hay falsos positivos nuevos: revisa la auditoría"; exit 1)
      - name: Límites del plan gratis (tamaños, builds/hora, peticiones por tienda)
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in data.json products.json data/prices.db.enc; do
            printf "%-20s %s bytes\n" "$f" "$(curl -sI "$PAGES_URL/$f" | grep -i content-length | tr -dc 0-9)"
          done
          SINCE=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M)
          BUILDS=$(gh api "repos/${{ github.repository }}/pages/builds?per_page=30" --jq "[.[] | select(.created_at > \"$SINCE\")] | length")
          echo "builds de Pages en la última hora: $BUILDS (límite blando: 10)"
          python -c "import maintenance as M; b=M.request_budget(); print('peticiones/min por tienda:', b); w=M.budget_warnings(b); [print('::warning::'+x) for x in w]"
          [ "$BUILDS" -le 10 ] || echo "::warning::Más de 10 builds de Pages en la última hora"
