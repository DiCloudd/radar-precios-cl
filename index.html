<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e17" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Radar de Precios</title>
<meta name="description" content="Monitor de precios de smartphones en tiendas chilenas, actualizado cada pocos minutos.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f6f7fb;--panel:#ffffff;--panel2:#f1f3f9;--text:#141826;--muted:#5f6b85;--line:#e3e7f0;
  --accent:#4f46e5;--accent2:#7c3aed;--good:#059669;--bad:#dc2626;--warn:#d97706;--gz:#ef4444;
  --chip:#eef0ff;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e17;--panel:#121725;--panel2:#182033;--text:#e8ecf6;--muted:#8a96b2;--line:#232c42;
  --accent:#818cf8;--accent2:#a78bfa;--good:#34d399;--bad:#f87171;--warn:#fbbf24;--gz:#f87171;
  --chip:#1d2540;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0b0e17;--panel:#121725;--panel2:#182033;--text:#e8ecf6;--muted:#8a96b2;--line:#232c42;
  --accent:#818cf8;--accent2:#a78bfa;--good:#34d399;--bad:#f87171;--warn:#fbbf24;--gz:#f87171;
  --chip:#1d2540;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--chip);font-size:12.5px;font-weight:600;color:var(--text);border:1px solid var(--line)}
.pill.ev{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:0}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font:700 26px/1.1 "JetBrains Mono",monospace;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:12.5px;margin-top:4px}
.gz{display:none;gap:16px;align-items:center;background:linear-gradient(110deg,#450a0a,#7f1d1d 45%,#b91c1c);color:#fff;border-radius:16px;padding:12px;margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden}
.gz img{width:200px;max-width:38%;border-radius:10px}
.gz h3{margin:0 0 4px;font-size:18px}.gz .msg{font-size:13.5px;opacity:.95}.gz a{color:#fde68a}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
nav.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13.5px}
nav.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=search],select{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
input[type=search]{flex:1 1 240px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
#catchips{width:100%}
#catchips .chip{font-size:13px;padding:6px 12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--chip);color:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .top{display:flex;gap:10px;align-items:flex-start}
.card img{width:64px;height:64px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.card .nm{font-weight:600;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.store{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.price{font:700 22px/1 "JetBrains Mono",monospace;letter-spacing:-.03em}
.old{color:var(--muted);text-decoration:line-through;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:7px;background:var(--panel2);color:var(--muted)}
.tag.down{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.up{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.tag.min{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.fake{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.tag.card{background:var(--chip);color:var(--accent)}
.pred{font-size:12px;color:var(--muted)}
svg.spark{width:100%;height:34px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px;vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--panel2);cursor:pointer;user-select:none;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel2);cursor:pointer}
td.num{font-family:"JetBrains Mono",monospace;text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}
.cmp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.cmp h4{margin:0 0 10px;font-size:14px;text-transform:capitalize}
.bar{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;font-size:13px;margin:4px 0}
.bar .track{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px}
.bar.best .fill{background:var(--good)}
.bar .p{font-family:"JetBrains Mono",monospace;text-align:right}
.feed .it{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13.5px;white-space:pre-line}
.feed .it.godzilla,.feed .it.price_error{border-left-color:var(--gz)}
.feed .it.blocked,.feed .it.layout{border-left-color:var(--warn)}
.feed .ts{font-size:11.5px;color:var(--muted);font-family:"JetBrains Mono",monospace}
.ok{color:var(--good);font-weight:700}.ko{color:var(--bad);font-weight:700}.wa{color:var(--warn);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:14px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:0;width:min(760px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(5,8,15,.6);backdrop-filter:blur(3px)}
.dlg{padding:18px}
.dlg h3{margin:0 0 4px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--panel2);border-radius:10px;padding:8px 10px}.stat b{display:block;font-family:"JetBrains Mono",monospace;font-size:15px}.stat span{font-size:11.5px;color:var(--muted)}
.pager{display:flex;gap:8px;justify-content:center;margin-top:12px;align-items:center;color:var(--muted);font-size:13px}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.exp a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);color:var(--text)}
.exp a b{display:block;font-size:15px;margin-bottom:4px}.exp a span{color:var(--muted);font-size:13px}
.secs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:thin}
.secs .chip{white-space:nowrap;font-size:13px;padding:6px 12px}
.sec{margin-bottom:22px}.sec h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:16px}
.sec h3 .n{font-size:12px;color:var(--muted);font-weight:600}.sec .more{margin-left:auto;font-size:12.5px}
.sec p.sub{margin:0 0 10px}
.filters{display:none;width:100%;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.filters.on{display:flex}
.filters input[type=number]{width:110px;font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.filters label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.tag.ganga{background:color-mix(in srgb,var(--gz) 22%,transparent);color:var(--gz)}
.card.hot{border-color:var(--gz)}
footer{margin-top:30px;color:var(--muted);font-size:12.5px;text-align:center}
@media (max-width:560px){.kpis{grid-template-columns:repeat(3,1fr);gap:8px}.kpi{padding:10px}.kpi .l{font-size:11px;line-height:1.25}input[type=search],select{font-size:16px}nav.tabs button{padding:9px 14px}.kpi .v{font-size:19px}.grid{grid-template-columns:1fr}.bar{grid-template-columns:90px 1fr 90px}.gz img{display:none}.price{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot" id="dot"></span>📡 Radar de Precios</div>
    <span class="pill" id="updated">cargando…</span>
    <span class="pill ev" id="event" hidden></span>
    <div class="spacer"></div>
    <button class="btn" id="install" hidden>📲 Instalar</button>
    <button class="btn" id="theme" title="Cambiar tema">🌓</button>
  </header>

  <section class="kpis" id="kpis"></section>
  <section class="gz" id="gz"><img src="godzilla.gif" alt="Alerta Godzilla animada"><div><h3>🦖 Última alerta Godzilla</h3><div class="msg" id="gzmsg"></div></div></section>

  <nav class="tabs" id="tabs">
    <button data-t="deals" class="on">🔥 Ofertas</button>
    <button data-t="compare">🔀 Comparador</button>
    <button data-t="all">📋 Todos</button>
    <button data-t="hall">🏆 Errores</button>
    <button data-t="fake">🤡 Chantas</button>
    <button data-t="alerts">🔔 Alertas</button>
    <button data-t="stores">🩺 Tiendas</button>
    <button data-t="events">📅 Eventos</button>
    <button data-t="export">⬇️ Exportar</button>
  </nav>

  <div class="toolbar" id="toolbar">
    <input type="search" id="q" placeholder="Buscar modelo, marca… (ej: iphone 17, galaxy a57)">
    <select id="sort">
      <option value="ch24">Mayor bajada 24 h</option>
      <option value="disc">Mayor descuento</option>
      <option value="price">Precio menor</option>
      <option value="-price">Precio mayor</option>
      <option value="new">Más recientes</option>
    </select>
    <button class="btn" id="fbtn">⚙️ Filtros</button>
    <div class="filters" id="filters">
      <label>Precio $<input type="number" id="fmin" inputmode="numeric" placeholder="mín"></label>
      <label>a $<input type="number" id="fmax" inputmode="numeric" placeholder="máx"></label>
      <select id="fbrand"><option value="">Todas las marcas</option></select>
      <select id="fdisc"><option value="0">Cualquier descuento</option><option value="20">-20% o más</option>
        <option value="30">-30% o más</option><option value="50">-50% o más</option><option value="70">-70% o más</option></select>
      <label><input type="checkbox" id="fstock"> Solo con stock</label>
      <label><input type="checkbox" id="fmkt"> Ocultar marketplace 🏪</label>
      <label><input type="checkbox" id="fref"> Ocultar reacondicionados/seminuevos</label>
      <button class="btn" id="freset">Limpiar</button>
    </div>
    <div class="chips" id="catchips"></div>
    <div class="chips" id="storechips"></div>
  </div>

  <main id="view"></main>
  <footer>Datos públicos de cada tienda, respetando su robots.txt. Ripley, Paris, Lider, MercadoLibre y Tottus vía
    <a href="https://www.solotodo.cl" target="_blank" rel="noopener">SoloTodo</a> 📚 (pueden tener ~1 h de desfase). Precios en CLP. Actualizado automáticamente. · <span id="runner"></span></footer>
</div>

<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>

<script>
const $ = s => document.querySelector(s);
const clp = n => n == null ? "–" : "$" + Math.round(n).toLocaleString("es-CL");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const ago = iso => { if(!iso) return "nunca"; const m = (Date.now() - new Date(iso)) / 60000;
  return m < 1 ? "hace segundos" : m < 60 ? `hace ${Math.round(m)} min` : m < 1440 ? `hace ${Math.round(m/60)} h` : `hace ${Math.round(m/1440)} d`; };
const state = { tab: "deals", q: "", sort: "ch24", stores: new Set(), page: 0, cat: "all", card: false, sec: "resumen",
  f: { min: null, max: null, brand: "", disc: 0, stock: false, mkt: false, ref: false } };
try { Object.assign(state.f, JSON.parse(localStorage.getItem("filters") || "{}")); } catch (e) {}
const REFURB = /reacondicionad|seminuev|refurb|open ?box|usad[oa]\b|outlet|caja abierta|exhibici/i;
const isMkt = p => (p.badges || []).some(b => b.startsWith("Vendedor: "));
try { state.card = localStorage.getItem("card") === "1"; } catch (e) {}
try { state.cat = localStorage.getItem("cat") || "all"; } catch (e) {}
try { state.sec = localStorage.getItem("sec") || "resumen"; } catch (e) {}
let D = null, chart = null;

// ---- tema (preferencia por visitante)
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  if (chart) render();
};

// ---- sanitizador para mensajes de alerta (solo b, i, s, a)
function safeHTML(html) {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
  const walk = n => { [...n.childNodes].forEach(c => {
    if (c.nodeType === 1) {
      if (!["B","I","S","A"].includes(c.tagName)) { c.replaceWith(...c.childNodes); return walk(n); }
      [...c.attributes].forEach(a => { if (!(c.tagName === "A" && a.name === "href" && /^https?:/.test(a.value))) c.removeAttribute(a.name); });
      if (c.tagName === "A") { c.target = "_blank"; c.rel = "noopener"; }
      walk(c);
    }}); };
  walk(doc.body.firstChild); return doc.body.firstChild.innerHTML;
}

function spark(hist) {
  if (!hist || hist.length < 2) return "";
  const ps = hist.map(h => h[1]), lo = Math.min(...ps), hi = Math.max(...ps), w = 240, h = 34;
  const pts = ps.map((p, i) => `${(i / (ps.length - 1) * w).toFixed(1)},${(hi === lo ? h/2 : h - 3 - (p - lo) / (hi - lo) * (h - 6)).toFixed(1)}`).join(" ");
  const col = ps.at(-1) <= ps[0] ? "var(--good)" : "var(--bad)";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${col}" stroke-width="2" points="${pts}"/></svg>`;
}

function tags(p) {
  let t = "";
  if (p.ch24 != null && p.ch24 !== 0) t += `<span class="tag ${p.ch24 < 0 ? "down" : "up"}">${p.ch24 > 0 ? "+" : ""}${p.ch24.toFixed(1)}% 24h</span>`;
  if (p.disc) t += `<span class="tag">-${Math.round(p.disc)}%</span>`;
  if (p.ganga) t += `<span class="tag ganga" title="${esc(p.ganga.why)}">🔥 ganga</span>`;
  if (p.atMin) t += `<span class="tag min">🏆 mínimo</span>`;
  if (p.card) t += `<span class="tag card">💳 ${clp(p.card)}</span>`;
  if (p.cuotas) t += `<span class="tag">${p.cuotas} cuotas</span>`;
  if (p.fake) t += `<span class="tag fake" title="${esc(p.fake)}">🤡 sospechosa</span>`;
  if (p.stock === false) t += `<span class="tag up">agotado</span>`;
  if ((p.badges || []).includes("vía SoloTodo")) t += `<span class="tag" title="${esc(p.stockText || "")}: precio informado por SoloTodo, puede tener desfase">📚 ${esc((p.stockText || "vía SoloTodo").replace("vía SoloTodo · ", ""))}</span>`;
  return t;
}

function cardHTML(p) {
  return `<div class="card ${p.ganga ? "hot" : ""}" data-k="${esc(p.key)}">
    <div class="top">${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="" onerror="this.remove()">` : ""}
      <div><div class="store">${(D.categories[p.cat] || "").split(" ")[0]} ${esc(p.store)}</div><div class="nm">${esc(p.name)}</div></div></div>
    <div class="row"><span class="price">${clp(p.price)}</span>${p.list ? `<span class="old">${clp(p.list)}</span>` : ""}</div>
    <div class="row">${tags(p)}</div>
    ${spark(p.hist)}
    ${p.ganga ? `<div class="pred">🔥 ${esc(p.ganga.why)}</div>` : ""}
    <div class="pred">${esc(p.pred?.label || "")}</div></div>`;
}

function passF(p, ignoreStock) {               // ⚙️ filtros (A3), guardados en el iPhone
  const f = state.f;
  return (!f.min || p.price >= f.min) && (!f.max || p.price <= f.max) &&
    (!f.brand || (p.brand || "").toLowerCase() === f.brand) && (!f.disc || (p.disc || 0) >= f.disc) &&
    (ignoreStock || !f.stock || p.stock !== false) && (!f.mkt || !isMkt(p)) && (!f.ref || !REFURB.test(p.name));
}
function filtered(ignoreStock) {
  const q = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return D.products.filter(p => !p.missing && (state.cat === "all" || p.cat === state.cat) &&
    (!state.stores.size || state.stores.has(p.site)) && passF(p, ignoreStock) &&
    q.every(w => (p.name + " " + (p.brand || "") + " " + p.store).toLowerCase().includes(w)));
}
function filtersUI() {
  const f = state.f, brands = [...new Set(D.products.map(p => (p.brand || "").trim().toLowerCase()).filter(Boolean))].sort();
  $("#fbrand").innerHTML = `<option value="">Todas las marcas</option>` + brands.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join("");
  $("#fmin").value = f.min ?? ""; $("#fmax").value = f.max ?? ""; $("#fbrand").value = f.brand; $("#fdisc").value = String(f.disc);
  $("#fstock").checked = f.stock; $("#fmkt").checked = f.mkt; $("#fref").checked = f.ref;
  const n = [f.min, f.max, f.brand, f.disc, f.stock, f.mkt, f.ref].filter(Boolean).length;
  $("#fbtn").textContent = n ? `⚙️ Filtros (${n})` : "⚙️ Filtros";
}
function saveF() {
  const num = v => v === "" ? null : Math.max(0, +v);
  Object.assign(state.f, { min: num($("#fmin").value), max: num($("#fmax").value), brand: $("#fbrand").value,
    disc: +$("#fdisc").value, stock: $("#fstock").checked, mkt: $("#fmkt").checked, ref: $("#fref").checked });
  try { localStorage.setItem("filters", JSON.stringify(state.f)); } catch (e) {}
  filtersUI(); state.page = 0; render();
}
$("#fbtn").onclick = () => $("#filters").classList.toggle("on");
["#fmin", "#fmax", "#fbrand", "#fdisc", "#fstock", "#fmkt", "#fref"].forEach(id => $(id).addEventListener("change", saveF));
$("#freset").onclick = () => { state.f = { min: null, max: null, brand: "", disc: 0, stock: false, mkt: false, ref: false }; filtersUI(); saveF(); };
function sorted(list) {
  const s = state.sort, k = {
    ch24: p => p.ch24 ?? 999, disc: p => -(p.disc ?? 0), price: p => p.price, "-price": p => -p.price,
    new: p => -new Date(p.first) }[s];
  return [...list].sort((a, b) => k(a) - k(b));
}

function kpis() {

function restockCard(r) {
  const p = D.products.find(x => x.key === r.key) || {};
  return `<div class="card hot" data-k="${esc(r.key)}">
    <div class="top">${r.image ? `<img loading="lazy" src="${esc(r.image)}" alt="" onerror="this.remove()">` : ""}
      <div><div class="store">🚨 ${esc(r.store)}</div><div class="nm">${esc(r.name)}</div></div></div>
    <div class="row"><span class="price">${clp(p.price ?? r.price)}</span><span class="old">nuevo ~${clp(r.ref)}</span></div>
    <div class="row"><span class="tag up">agotado</span><span class="tag ganga">vigilando desde ${ago(r.since)}</span></div>
    <div class="pred">${esc(r.reason || "")}</div><div class="pred">Te aviso por Telegram al instante si vuelve el stock.</div></div>`;
}
function sections() {
  const all = filtered(), live = all.filter(p => p.stock !== false), byKey = new Map(D.products.map(p => [p.key, p]));
  const cheaper = [];
  for (const c of D.comparisons || []) {
    if (state.cat !== "all" && c.cat !== state.cat) continue;
    const best = byKey.get(c.items[0].key), second = c.items[1];
    if (!best || !second || !all.includes(best)) continue;
    const save = second.price - best.price;
    if (save >= 10000 && save / second.price >= 0.08) cheaper.push({ ...best, _save: save });
  }
  cheaper.sort((a, b) => b._save - a._save);
  const cardOf = p => p.card && p.card < p.price ? (1 - p.card / (p.list || p.price)) : 0;
  const restock = (D.restock || []).filter(r => (state.cat === "all" || byKey.get(r.key)?.cat === state.cat) &&
    (!state.stores.size || state.stores.has(r.site)) && (!state.q || r.name.toLowerCase().includes(state.q.toLowerCase())) &&
    (!state.f.ref || !REFURB.test(r.name)) && (!state.f.min || r.price >= state.f.min) && (!state.f.max || r.price <= state.f.max));
  return [
    { id: "gangas", title: "🔥 Gangas", desc: "Muy por debajo de lo que cuesta ese modelo nuevo en el catálogo (incluye seminuevos baratísimos).",
      list: live.filter(p => p.ganga).sort((a, b) => a.price / a.ganga.ref - b.price / b.ganga.ref), empty: "Ninguna ganga con stock ahora mismo." },
    { id: "restock", title: "🚨 Agotadas en vigilancia", desc: "Gangas sin stock: el radar las relee cada pocos minutos y te avisa al instante si vuelven.",
      list: restock, card: restockCard, empty: "No hay gangas agotadas en vigilancia." },
    { id: "hora", title: "⚡ Última hora", desc: "Lo que más bajó en las últimas 24 h.",
      list: live.filter(p => (p.ch24 ?? 0) < 0).sort((a, b) => a.ch24 - b.ch24), empty: "Nada bajó en las últimas 24 h con estos filtros." },
    { id: "minimos", title: "🏆 Mínimos históricos", desc: "Hoy están al precio más bajo que el radar les ha visto.",
      list: live.filter(p => p.atMin).sort((a, b) => (a.ch24 ?? 0) - (b.ch24 ?? 0)), empty: "Ningún producto en su mínimo histórico con estos filtros." },
    { id: "tiendas", title: "🔀 Más barato que en otras tiendas", desc: "El mismo modelo cuesta bastante más en la tienda siguiente (8 %+ y $10.000+).",
      list: cheaper, empty: "Sin diferencias grandes entre tiendas con estos filtros." },
    { id: "tarjeta", title: "💳 Con tarjeta de la tienda", desc: "El mayor descuento pagando con CMR, La Polar, Hites…",
      list: live.filter(p => cardOf(p) >= 0.15).sort((a, b) => cardOf(b) - cardOf(a)), empty: "Sin descuentos con tarjeta destacados." },
    { id: "todas", title: "📋 Todas las ofertas", desc: "Todo lo que bajó, está en mínimo o tiene -20 %+ (usa el orden de arriba).",
      list: sorted(all).filter(p => (p.ch24 ?? 0) < 0 || p.atMin || (p.disc ?? 0) >= 20), empty: "Aún no hay ofertas: el radar necesita algunas horas de historial 📡" },
  ];
}

function render() {
  const showTools = ["deals", "all", "compare", "fake", "hall"].includes(state.tab);
  $("#toolbar").style.display = showTools ? "flex" : "none";
  $("#sort").style.display = state.tab === "all" || (state.tab === "deals" && state.sec === "todas") ? "" : "none";
  $("#view").innerHTML = views[state.tab]();
  $("#view").querySelectorAll("[data-k]").forEach(el => el.onclick = () => openProduct(el.dataset.k));
  $("#prev")?.addEventListener("click", () => { state.page = Math.max(0, state.page - 1); render(); });
  $("#view").querySelectorAll("[data-sec]").forEach(el => el.onclick = ev => { ev.preventDefault();
    state.sec = el.dataset.sec; try { localStorage.setItem("sec", state.sec); } catch (e) {} render(); scrollTo({ top: $("#tabs").offsetTop - 8, behavior: "smooth" }); });
  $("#cardtoggle")?.addEventListener("change", e => { state.card = e.target.checked;
    try { localStorage.setItem("card", state.card ? "1" : "0"); } catch (err) {} render(); });
  $("#next")?.addEventListener("click", () => { state.page++; render(); });
}

async function openProduct(key) {
  let p = D.products.find(x => x.key === key);
  if (!p) { await ensureFull(); p = D.products.find(x => x.key === key); }
  if (!p) return;
  const pr = p.pred || {};
  const others = (D.comparisons.find(c => c.group === p.group)?.items || []).filter(i => i.key !== p.key);
  $("#dlgbody").innerHTML = `<div class="row" style="justify-content:space-between"><div><div class="store">${esc(p.store)}</div><h3>${esc(p.name)}</h3></div>
    <button class="btn" onclick="document.getElementById('dlg').close()">✕</button></div>
    <div class="row"><span class="price">${clp(p.price)}</span>${p.list ? `<span class="old">${clp(p.list)}</span>` : ""}${tags(p)}</div>
    ${p.fake ? `<p class="tag fake" style="display:block;margin-top:10px">🤡 ${esc(p.fake)}</p>` : ""}
    ${p.ganga ? `<p class="tag ganga" style="display:block;margin-top:10px">🔥 Ganga: ${esc(p.ganga.why)}</p>` : ""}
    ${(D.restock || []).some(r => r.key === p.key) ? `<p class="tag ganga" style="display:block;margin-top:6px">🚨 En vigilancia: te aviso al instante si vuelve el stock</p>` : ""}
    <canvas id="hc" height="200" style="margin-top:12px"></canvas>
    <div class="stats">
      <div class="stat"><b>${clp(p.min)}</b><span>mínimo histórico</span></div><div class="stat"><b>${clp(p.max)}</b><span>máximo</span></div>
      <div class="stat"><b>${pr.prob_drop_7d != null ? Math.round(pr.prob_drop_7d * 100) + "%" : "–"}</b><span>prob. de baja en 7 días</span></div>
      <div class="stat"><b>${pr.avg_days_between_drops ?? "–"}</b><span>días promedio entre bajas</span></div>
      <div class="stat"><b>${pr.best_weekday ?? "–"}</b><span>día que más baja</span></div>
      <div class="stat"><b>${pr.trend_30d_pct != null ? pr.trend_30d_pct + "%" : "–"}</b><span>tendencia 30 días</span></div></div>
    <p class="pred">🔮 ${esc(pr.label || "")} · confianza ${esc(pr.confidence || "baja")}</p>
    ${others.length ? `<p class="sub"><b>En otras tiendas:</b> ${others.map(o => `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.store)} ${clp(o.price)}</a>`).join(" · ")}</p>` : ""}
    <p class="sub">Visto por primera vez ${ago(p.first)} · última revisión ${ago(p.last)}${p.badges?.length ? " · 🏷️ " + p.badges.map(esc).join(", ") : ""}</p>
    <a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener" style="display:inline-block">Ir a la tienda →</a>`;
  $("#dlg").showModal();
  if (window.Chart) {
    const css = getComputedStyle(root), col = css.getPropertyValue("--accent").trim(), grid = css.getPropertyValue("--line").trim(), txt = css.getPropertyValue("--muted").trim();
    const h = p.hist.length ? [...p.hist, [p.last.slice(0, 16), p.price]] : [[p.last.slice(0, 16), p.price]];
    chart?.destroy();
    chart = new Chart($("#hc"), { type: "line", data: { labels: h.map(x => x[0].replace("T", " ")),
      datasets: [{ data: h.map(x => x[1]), borderColor: col, backgroundColor: col + "22", fill: true, stepped: true, pointRadius: 2 }] },
      options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => clp(c.parsed.y) } } },
        scales: { x: { ticks: { color: txt, maxTicksLimit: 6 }, grid: { color: grid } }, y: { ticks: { color: txt, callback: v => clp(v) }, grid: { color: grid } } } } });
  }
}

$("#tabs").onclick = async e => { const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); state.tab = b.dataset.t; state.page = 0;
  if (state.tab === "all" && D.coreOnly) { $("#view").innerHTML = `<div class="empty">📦 Cargando el catálogo completo…</div>`; await ensureFull(); }
  render(); };
$("#q").oninput = async e => { state.q = e.target.value; state.page = 0; render();
  if (state.q.trim() && D.coreOnly) { await ensureFull(); render(); } };   // buscar = en TODO el catálogo
$("#sort").onchange = e => { state.sort = e.target.value; render(); };

let fullLoading = null;
async function ensureFull() {            // 📦 catálogo completo: solo al buscar, abrir "Todos" o un producto fuera del resumen
  if (!D || !D.coreOnly) return;
  fullLoading = fullLoading || fetch("products.json?t=" + Date.now()).then(r => r.json()).then(all => {
    D.products = all; D.coreOnly = false; }).catch(() => {}).finally(() => { fullLoading = null; });
  await fullLoading;
}

async function load() {
  const wasFull = D && !D.coreOnly;      // si ya habías abierto el catálogo completo, se mantiene al refrescar
  try {
    D = await (await fetch("data.json?t=" + Date.now())).json();
  } catch (e) { $("#view").innerHTML = `<div class="empty">No se pudo cargar data.json</div>`; return; }
  if (wasFull || state.tab === "all" || state.q.trim()) await ensureFull();
  $("#updated").textContent = "🕒 actualizado " + ago(D.generated);
  $("#runner").textContent = "runner: " + D.runner;
  const stale = Date.now() - new Date(D.generated) > 3 * 3600e3;
  $("#dot").style.background = stale ? "var(--warn)" : "var(--good)";
  if (D.event) { $("#event").hidden = false; $("#event").textContent = "🎉 " + D.event; }
  kpis(); catChips(); storeChips(); filtersUI(); render();
}
load();
setInterval(load, 5 * 60e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });  // al volver a la app, datos frescos
// iPhone: guía para agregar a la pantalla de inicio
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
if (isIOS && !standalone) {
  $("#install").hidden = false;
  $("#install").onclick = () => { $("#dlgbody").innerHTML = `<h3>📲 Instalar en tu iPhone</h3>
    <ol style="line-height:1.9"><li>Toca <b>Compartir</b> <span style="font-size:18px">⎋</span> en la barra de Safari</li>
    <li>Elige <b>“Agregar a pantalla de inicio”</b></li><li>Toca <b>Agregar</b>: el Radar queda como app 🎉</li></ol>
    <button class="btn" onclick="document.getElementById('dlg').close()">Entendido</button>`; $("#dlg").showModal(); };
}
</script>
</body>
</html>
